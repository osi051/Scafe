<!doctype html>
<html lang="tg"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фастфуд</title>
<style>
:root{--bg:#fff8f0;--c:#fff;--t:#2a1a10;--m:#7a6a5e;--p:#d9381e;--b:#ecdccc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--c:#2a201a;--t:#f5e9df;--m:#b5a396;--b:#3d2f26}}
:root[data-theme="dark"]{--bg:#1b1410;--c:#2a201a;--t:#f5e9df;--m:#b5a396;--b:#3d2f26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
#w{max-width:640px;margin:0 auto;padding:12px 12px 90px}
button,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px 12px}
input{width:100%;box-sizing:border-box;margin:5px 0}
input[type=radio]{width:auto}
.pb{background:var(--p);color:#fff;border:0;font-weight:600}
.fx{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;padding:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:8px 0}
.g .cd{margin:0;cursor:pointer}.off{opacity:.5}
.em{font-size:40px}
.im{width:100%;height:90px;object-fit:cover;border-radius:10px}
.bg{height:160px}.rc{object-fit:contain;height:auto;max-height:320px}
.th{width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.nv{display:flex;gap:8px;justify-content:space-between;margin:12px 0}
.n{background:var(--c);border:1px solid var(--p);border-radius:10px;padding:10px;margin:8px 0}
.ok{border:2px solid #1d8a4a}.bad{border:2px solid #d9381e}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.bx{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.on{background:var(--p);color:#fff;border:0}
small{color:var(--m)}
</style></head><body><div id="w">
<div id="app">Бор мешавад...</div>
<input type="file" accept="image/*" id="fi" hidden onchange="Up(this)">
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={d:[],o:[],pay:''},LO=null,AU=null,uo=()=>{},ao=0;
let v=location.hash=='#admin'?'a':'c',st=0,det='',tab='o',cart={},nt={},f={type:'del',pay:'cash'},pid='',nph='',ck='';
const dd=i=>S.d.find(x=>x.id==i);
const tot=o=>Object.entries(o).reduce((a,[i,q])=>a+q*(dd(i)?dd(i).p:0),0);
const pic=(d,c)=>d.i?`<img class="im ${c||''}" src="${d.i}" alt="">`:`<div class="em">${d.e||'🍽️'}</div>`;
const due=o=>o.at+(o.m+10)*60000;
const sid=o=>'#'+o.id.slice(-4);
function R(){$('#app').innerHTML=v=='c'?C():A()}
window.onhashchange=()=>{v=location.hash=='#admin'?'a':'c';R()};
function Q(i,k){
 if(k>0&&(cart[i]||0)>=dd(i).k)return alert('Бештар нест');
 cart[i]=(cart[i]||0)+k;if(cart[i]<=0){delete cart[i];delete nt[i]}
 if(!Object.keys(cart).length)st=0;R();
}
function G(){navigator.geolocation.getCurrentPosition(p=>{f.a=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);R()},()=>alert('Ҷойгиршавӣ дастнорас аст'))}
async function P(){
 if(!f.ph)return alert('Рақами телефонро нависед');
 if(f.type=='del'&&!f.a)return alert('Суроғаро нависед');
 if(f.pay=='card'&&!ck)return alert('Акси чекро фиристед');
 const o={ph:f.ph,ty:f.type,a:f.a||'',pay:f.pay,st:'new',m:0,ts:Date.now(),ck:f.pay=='card'?ck:'',
  it:Object.entries(cart).map(([i,q])=>({id:i,q,n:dd(i).n,p:dd(i).p,c:nt[i]||''}))};
 try{
  const r=await DB.add('orders',o);
  try{localStorage.setItem('last',r.id)}catch(e){}
  uo();uo=DB.order(r.id,x=>{LO=x;if(st==0&&v=='c')R()});
  cart={};nt={};st=0;ck='';f={type:'del',pay:'cash'};R();
 }catch(e){alert('Хато: фармоиш нарасид. Боз кӯшиш кунед.')}
}
function Rv(id,s){DB.set('orders',id,{st:s})}
function ban(o){
 const L=o.it.map(i=>esc(i.n)+' × '+i.q+(i.c?' ('+esc(i.c)+')':'')).join(', ');
 if(o.st=='new')return `⏳ Фармоиши ${sid(o)} интизори тасдиқ аст.`;
 if(o.st=='done')return '🎉 Ташаккур! Фармоиш гирифта шуд.';
 if(o.st=='no')return '😔 Бубахшед, мо бо шумо тамос мегирем.';
 if(Date.now()>=due(o))return `✅ Қабул шуд: ${L}.<br><b>Фармоишро гирифтед?</b><div class="nv"><button class="pb" onclick="Rv('${o.id}','done')">Бале</button><button onclick="Rv('${o.id}','no')">Не</button></div>`;
 return `✅ Фармоиши ${sid(o)} қабул шуд: ${L}.<br>Омода мешавад: ${o.m} дақиқа.`;
}
function C(){
 let h='';
 if(LO)h+=`<div class="n">${ban(LO)}</div>`;
 if(st==0){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  if(!S.d.length)h+='<p>Меню ҳоло холӣ аст.</p>';
  h+='<div class="g">'+S.d.map(d=>`<div class="cd ${d.k>0?'':'off'}" onclick="det='${d.id}';R()">${pic(d)}<b>${esc(d.n)}</b><div>${d.o?`<s>${d.o}</s> `:''}${d.p} сомонӣ</div><small>${d.k>0?'⏱ '+d.t+' дақ.':'Нест'}</small></div>`).join('')+'</div>';
  if(det&&dd(det)){const d=dd(det);h+=`<div class="md" onclick="det='';R()"><div class="bx" onclick="event.stopPropagation()">${pic(d,'bg')}<h3>${esc(d.n)}</h3><p>${esc(d.r||'')}</p><p>⏱ ${d.t} дақиқа · <b>${d.p} сомонӣ</b></p>${d.k>0?`<button class="pb" onclick="Q('${d.id}',1);det='';R()">Ба сабад илова кунед</button>`:'<p><b>Ҳозир нест</b></p>'}</div></div>`}
  if(n)h+=`<button class="pb fx" onclick="st=1;R()">Фармоиш (${n}) · ${tot(cart)} сомонӣ</button>`;
 }else if(st==1){
  h+='<h3>Фармоиши шумо</h3>'+Object.entries(cart).map(([i,q])=>`<div class="cd"><div class="r"><span>${esc(dd(i).n)}</span><span><button onclick="Q('${i}',-1)">−</button> ${q} <button onclick="Q('${i}',1)">+</button></span><b>${dd(i).p*q}</b></div><input placeholder="Эзоҳ (масалан: капуста кам)" value="${esc(nt[i]||'')}" oninput="nt['${i}']=this.value"></div>`).join('')+`<div class="r"><b>Ҷамъ</b><b>${tot(cart)} сомонӣ</b></div><div class="nv"><button onclick="st=0;R()">← Ба қафо</button><button class="pb" onclick="st=2;R()">Ба пеш →</button></div>`;
 }else{
  h+=`<h3>Маълумот</h3><input type="tel" placeholder="Рақами телефон" value="${esc(f.ph||'')}" oninput="f.ph=this.value">
  <div class="r"><label><input type="radio" name="ty" ${f.type=='del'?'checked':''} onchange="f.type='del';R()"> Доставка</label><label><input type="radio" name="ty" ${f.type=='in'?'checked':''} onchange="f.type='in';R()"> Дар ҷой</label></div>`;
  if(f.type=='del')h+=`<input placeholder="Суроға" value="${esc(f.a||'')}" oninput="f.a=this.value"><button onclick="G()">📍 Ҷойгиршавии ман</button>`;
  h+=`<div class="r"><label><input type="radio" name="py" ${f.pay=='cash'?'checked':''} onchange="f.pay='cash';R()"> Нақд</label><label><input type="radio" name="py" ${f.pay=='card'?'checked':''} onchange="f.pay='card';R()"> Корт</label></div>`;
  if(f.pay=='card')h+=`<div class="n">💳 Маблағи ${tot(cart)} сомониро ба корт гузаронед${S.pay?': <b>'+esc(S.pay)+'</b>':''}. Баъд акси чекро фиристед.</div><button onclick="pid='ck';$('#fi').click()">📎 Ирсоли акси чек ${ck?'✓':''}</button>${ck?`<img class="im rc" src="${ck}" alt="">`:''}`;
  h+=`<div class="nv"><button onclick="st=1;R()">← Ба қафо</button><button class="pb" onclick="P()">Фармоиш додан</button></div>`;
 }
 return h;
}
function Up(inp){
 const fl=inp.files[0];if(!fl)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas'),s=Math.min(1,360/Math.max(im.width,im.height));
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const u=c.toDataURL('image/jpeg',.7);
  if(pid=='ck'){ck=u;R()}else if(pid)DB.set('menu',pid,{i:u});else{nph=u;R()}};im.src=r.result};
 r.readAsDataURL(fl);inp.value='';
}
function Lg(){DB.login($('#le').value,$('#lp').value).catch(()=>alert('Почта ё парол нодуруст аст'))}
function X(oid,iid){const o=S.o.find(x=>x.id==oid);DB.set('orders',oid,{it:o.it.filter(x=>x.id!=iid)})}
function Ac(id){
 const o=S.o.find(x=>x.id==id),m=+$('#m'+id).value;if(!m)return alert('Дақиқаро нависед');
 DB.accept(o,m,S.d.map(d=>d.id)).catch(()=>alert('Хато. Боз кӯшиш кунед.'));
}
function Add(){
 const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!p)return alert('Ном ва нархро нависед');
 const d={n,p,t:+$('#at').value||10,k:+$('#ak').value||0,r:$('#ar').value,e:'🍽️'};
 if(+$('#ao').value)d.o=+$('#ao').value;if(nph)d.i=nph;nph='';DB.add('menu',d).then(R);
}
function A(){
 if(!AU)return `<div class="cd"><b>Воридшавии админ</b><input id="le" type="email" placeholder="Почта"><input id="lp" type="password" placeholder="Парол"><button class="pb" onclick="Lg()">Ворид шудан</button></div>`;
 let h=`<div class="nv"><button class="${tab=='o'?'on':''}" onclick="tab='o';R()">Фармоишҳо</button><button class="${tab=='m'?'on':''}" onclick="tab='m';R()">Меню</button><button onclick="DB.logout()">Баромадан</button></div>`;
 if(tab=='o'){
  if(!S.o.length)h+='<p>Фармоиш ҳоло нест.</p>';
  h+=S.o.slice().reverse().map(o=>`<div class="cd ${o.st=='done'?'ok':o.st=='no'?'bad':''}"><b>${sid(o)}</b> · ${new Date(o.ts).toLocaleTimeString().slice(0,5)} · ${esc(o.ph)} · ${o.ty=='del'?'Доставка: '+esc(o.a):'Дар ҷой'} · ${o.pay=='card'?'Корт':'Нақд'}
  ${o.it.map(i=>`<div class="r"><span>${esc(i.n)} × ${i.q}${i.c?'<br><small>💬 '+esc(i.c)+'</small>':''}</span><span>${i.p*i.q} ${o.st=='new'?`<button onclick="X('${o.id}','${i.id}')">✕</button>`:''}</span></div>`).join('')}
  <div class="r"><b>Ҷамъ: ${o.it.reduce((a,i)=>a+i.p*i.q,0)} сомонӣ</b></div>
  ${o.ck?`<small>🧾 Чеки пардохт:</small><img class="im rc" src="${o.ck}" alt="">`:''}
  ${o.st=='new'?`<input id="m${o.id}" type="number" placeholder="Чанд дақиқа омода мешавад?"><button class="pb" onclick="Ac('${o.id}')">Қабул ва паём ба мизоҷ</button>`
  :o.st=='ok'?`<small>✅ Қабул шуд · ${o.m} дақ. · Ҷавоби мизоҷ интизор аст</small>`
  :o.st=='done'?'<b>✅ Муваффақ</b>':'<b>❌ Мизоҷ нагирифт</b>'}</div>`).join('');
 }else{
  h+=S.d.map(d=>`<div class="cd"><div class="r"><span>${d.i?`<img class="th" src="${d.i}" alt="">`:''}<b>${esc(d.n)}</b></span><span><button onclick="pid='${d.id}';$('#fi').click()">📷</button> <button onclick="if(confirm('Нест кунем?'))DB.del('menu','${d.id}')">🗑</button></span></div>
  <div class="r"><label><small>Нарх</small><input type="number" value="${d.p}" onchange="DB.set('menu','${d.id}',{p:+this.value})"></label><label><small>Мондаи анбор (дона)</small><input type="number" value="${d.k}" onchange="DB.set('menu','${d.id}',{k:+this.value})"></label></div></div>`).join('')
  +`<div class="cd"><b>Маълумоти пардохт (рақами корт)</b><input placeholder="Рақами корт ва ном" value="${esc(S.pay||'')}" onchange="DB.set('cfg','main',{pay:this.value})"></div><div class="cd"><b>Таоми нав / комбо / аксия</b><input id="an" placeholder="Ном (масалан: Комбо: бургер + фри)"><input id="ap" type="number" placeholder="Нарх"><input id="ao" type="number" placeholder="Нархи пештара (барои аксия)"><input id="at" type="number" placeholder="Дақиқа"><input id="ak" type="number" placeholder="Чанд дона дорем?"><input id="ar" placeholder="Рецепт / таркиб"><button onclick="pid='';$('#fi').click()">📷 Акс интихоб кунед ${nph?'✓':''}</button> <button class="pb" onclick="Add()">Илова кардан</button></div>`;
 }
 return h;
}
function init(){
 DB.menu(a=>{S.d=a;if(v=='c'?st==0:true)R()});
 DB.cfg(c=>{S.pay=c.pay||''});
 let id='';try{id=localStorage.getItem('last')}catch(e){}
 if(id)uo=DB.order(id,o=>{LO=o;if(st==0&&v=='c')R()});
 DB.auth(u=>{AU=u;if(u&&!ao){ao=1;DB.orders(a=>{S.o=a;R()})}R()});
}
window.addEventListener('dbready',init);
setInterval(()=>{if(v=='c'&&st==0&&!det&&LO&&LO.st=='ok'&&Date.now()>=due(LO))R()},20000);
R();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,onSnapshot,addDoc,setDoc,deleteDoc,writeBatch,increment,query,orderBy} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const app=initializeApp({
 apiKey:"AIzaSyAVHyZgnmzcIU6j-XjcAa6fC4tvioscRqk",
 authDomain:"fast-food-fe9ab.firebaseapp.com",
 projectId:"fast-food-fe9ab",
 storageBucket:"fast-food-fe9ab.firebasestorage.app",
 messagingSenderId:"769329495086",
 appId:"1:769329495086:web:8f3b416253d55b972e73bf"});
const db=getFirestore(app),au=getAuth(app);
const list=s=>s.docs.map(d=>({...d.data(),id:d.id}));
const W=e=>{alert('Хато: '+e.code+'. Қоидаҳои Firestore ва почтаи админро санҷед.');throw e};
window.DB={
 menu:cb=>onSnapshot(collection(db,'menu'),s=>cb(list(s))),
 orders:cb=>onSnapshot(query(collection(db,'orders'),orderBy('ts')),s=>cb(list(s)),e=>console.log(e)),
 order:(id,cb)=>onSnapshot(doc(db,'orders',id),s=>cb(s.exists()?{...s.data(),id:s.id}:null)),
 cfg:cb=>onSnapshot(doc(db,'cfg','main'),s=>cb(s.data()||{})),
 set:(c,id,d)=>setDoc(doc(db,c,id),d,{merge:true}).catch(W),
 add:(c,d)=>addDoc(collection(db,c),d).catch(W),
 del:(c,id)=>deleteDoc(doc(db,c,id)).catch(W),
 accept:(o,m,ids)=>{const b=writeBatch(db);
  o.it.forEach(i=>{if(ids.includes(i.id))b.update(doc(db,'menu',i.id),{k:increment(-i.q)})});
  b.update(doc(db,'orders',o.id),{st:'ok',m,at:Date.now()});return b.commit()},
 login:(e,p)=>signInWithEmailAndPassword(au,e,p),
 logout:()=>signOut(au),
 auth:cb=>onAuthStateChanged(au,cb)};
window.dispatchEvent(new Event('dbready'));
</script></body></html>
