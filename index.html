<meta name="theme-color" content="#000000">
<style>
:root{--bg:#fff8f0;--c:#fff;--t:#2a1a10;--m:#7a6a5e;--p:#d9381e;--b:#ecdccc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1410;--c:#2a201a;--t:#f5e9df;--m:#b5a396;--b:#3d2f26}}
:root[data-theme="dark"]{--bg:#1b1410;--c:#2a201a;--t:#f5e9df;--m:#b5a396;--b:#3d2f26}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px system-ui,sans-serif}
#w{max-width:640px;margin:0 auto;padding:12px 12px 90px}
button,input{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px 12px}
input{width:100%;box-sizing:border-box;margin:5px 0}
input[type=radio]{width:auto}
.pb{background:var(--p);color:#fff;border:0;font-weight:600}
.fx{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;padding:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:12px;margin:8px 0}
.g .cd{margin:0;cursor:pointer}.off{opacity:.5}
.em{font-size:40px}
.im{width:100%;height:90px;object-fit:cover;border-radius:10px}
.bg{height:160px}.rc{object-fit:contain;height:auto;max-height:320px}
.th{width:44px;height:44px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
.nv{display:flex;gap:8px;justify-content:space-between;margin:12px 0}
.n{background:var(--c);border:1px solid var(--p);border-radius:10px;padding:10px;margin:8px 0}
.ok{border:2px solid #1d8a4a}.bad{border:2px solid #d9381e}
.md{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;justify-content:center;z-index:5}
.bx{background:var(--bg);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.on{background:var(--p);color:#fff;border:0}
small{color:var(--m)}
body{font-family:'Segoe UI',system-ui,sans-serif}
.hero{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;margin-bottom:14px;color:#fff;background:linear-gradient(135deg,#d9381e,#ff8a3d);box-shadow:0 8px 24px #d9381e44}
.hero h1{margin:0;font-size:30px;letter-spacing:2px}.hero small{color:#ffe9dc}
.lg{font-size:46px}
.cd{box-shadow:0 2px 10px #0000001a;position:relative;transition:transform .15s}
.g .cd{animation:up .4s both}.g .cd:active{transform:scale(.97)}
.pr{font-weight:700;color:var(--p)}
.rib{position:absolute;top:8px;left:8px;background:#ffcf33;color:#3a2600;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;z-index:1}
.pb{background:linear-gradient(135deg,#d9381e,#ff6a3d);box-shadow:0 4px 12px #d9381e55}
button{transition:transform .1s}button:active{transform:scale(.96)}
.bx{animation:sl .25s}
.ts{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;z-index:9;animation:up .3s}
.n{border-left:5px solid var(--p)}
.nw{border:2px solid #ff9f1a;animation:pl 1.6s infinite}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
@keyframes sl{from{transform:translateY(100%)}}
@keyframes pl{50%{box-shadow:0 0 0 6px #ff9f1a44}}
select{width:100%;margin:5px 0;font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px 12px}
.nv{flex-wrap:wrap}#w{padding-bottom:150px}
.fx{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
.nb{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
.nb button{flex:1;border:0;background:none;font-size:20px;padding:4px;border-radius:8px}
.nb .on{background:none;color:var(--p);font-weight:700}.nb small{font-size:11px;color:inherit}
.bt{display:block;background:var(--c);border:1px solid var(--b);border-radius:14px;padding:16px;margin:10px 0;color:var(--t);text-decoration:none;font-weight:600}
#sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none;margin-bottom:14px}
.bn{flex:0 0 100%;scroll-snap-align:start;height:150px;border-radius:20px;background:linear-gradient(135deg,#d9381e,#ff8a3d) center/cover;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px;box-sizing:border-box;text-shadow:0 1px 6px #0009}
.bn b{font-size:22px}
.nb{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;padding:6px;gap:4px;border:1px solid var(--b);border-radius:28px;background:color-mix(in srgb,var(--c) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px #0003}
.nb button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:22px;font-size:11px;font-weight:600;color:var(--m);transition:all .2s}
.nb svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.nb .on{background:color-mix(in srgb,var(--p) 15%,transparent);color:var(--p)}
.nb .on svg{transform:translateY(-1px) scale(1.12)}
.fx{bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.bn[onclick]{cursor:pointer}.bn small{color:#fff;font-weight:700;margin-top:4px}
#ch{display:flex;gap:8px;overflow-x:auto;margin:0 0 12px;scrollbar-width:none}#ch button{white-space:nowrap;border-radius:20px;padding:8px 14px}
.nb button{position:relative}.bd{position:absolute;top:2px;left:55%;background:var(--p);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px}
img.lg{width:64px;height:64px;border-radius:16px;box-shadow:0 4px 14px #0006}
</style></head><body><div id="w">
<div id="app">Бор мешавад...</div>
<input type="file" accept="image/*" id="fi" hidden onchange="Up(this)">
</div>
<script>
const $=s=>document.querySelector(s);
const LOGO=document.getElementById('ic').href;
document.head.insertAdjacentHTML('beforeend','<link rel="apple-touch-icon" href="'+LOGO+'">');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={d:[],o:[],pay:'',c:{}},LO=null,AU=null,uo=()=>{},ao=0;
let v=location.hash=='#admin'?'a':'c',st=0,det='',tab='o',cart={},nt={},f={type:'del',pay:'cash'},pid='',nph='',ck='',cl='h',gc='',nbi='',hist=null,ed='',sv=0;
const ME=()=>{try{return JSON.parse(localStorage.getItem('me'))||{}}catch(e){return{}}};
const IDS=()=>{try{return JSON.parse(localStorage.getItem('ids'))||[]}catch(e){return[]}};
const OL=()=>S.o.filter(o=>Date.now()-o.ts<864e5);
const safe=u=>/^https?:\/\//i.test(u||'')?esc(u):'';
const dd=i=>S.d.find(x=>x.id==i);
const dk=k=>dd(k.split('|')[0]);
const vv=k=>{const d=dk(k),x=k.split('|')[1];return d&&x!==undefined&&d.v&&d.v[x]?d.v[x]:null};
const vp=k=>vv(k)?vv(k).p:dk(k).p;
const vn=k=>dk(k).n+(vv(k)?' · '+vv(k).n:'');
const tot=o=>Object.entries(o).reduce((a,[i,q])=>a+q*(dk(i)?vp(i):0),0);
const pic=(d,c)=>d.i?`<img class="im ${c||''}" src="${d.i}" alt="">`:`<div class="em">${d.e||'🍽️'}</div>`;
const due=o=>o.at+(o.m+10)*60000;
const sid=o=>'#'+o.id.slice(-4);
function R(){$('#app').innerHTML=v=='c'?C():A()}
function T(t){const e=document.createElement('div');e.className='ts';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1600)}
let ld=0;function Bp(){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();c.close()},350)}catch(e){}}
window.onhashchange=()=>{v=location.hash=='#admin'?'a':'c';R()};
function Q(i,k){
 const id0=i.split('|')[0],used=Object.entries(cart).filter(([x])=>x.split('|')[0]==id0).reduce((a,[,q])=>a+q,0);
 if(k>0&&used>=dd(id0).k)return alert('Бештар нест');
 cart[i]=(cart[i]||0)+k;if(cart[i]<=0){delete cart[i];delete nt[i]}
 if(!Object.keys(cart).length)st=0;R();
}
function G(){navigator.geolocation.getCurrentPosition(p=>{f.a=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);R()},()=>alert('Ҷойгиршавӣ дастнорас аст'))}
async function P(){
 if(!f.ph)return alert('Рақами телефонро нависед');
 if(f.type=='del'&&!f.a)return alert('Суроғаро нависед');
 if(f.pay=='card'&&!ck)return alert('Акси чекро фиристед');
 const o={nm:f.nm||'',ph:f.ph,ty:f.type,a:f.a||'',pay:f.pay,st:'new',m:0,ts:Date.now(),ck:f.pay=='card'?ck:'',
  it:Object.entries(cart).map(([i,q])=>({id:i.split('|')[0],q,n:vn(i),p:vp(i),c:nt[i]||''}))};
 try{
  const r=await DB.add('orders',o);
  try{localStorage.setItem('last',r.id);localStorage.setItem('ids',JSON.stringify([r.id,...IDS()].slice(0,30)));localStorage.setItem('me',JSON.stringify({nm:f.nm||'',ph:f.ph}))}catch(e){}
  uo();uo=DB.order(r.id,x=>{LO=x;if(st==0&&v=='c')R()});
  cart={};nt={};st=0;ck='';f={type:'del',pay:'cash'};R();
 }catch(e){alert('Хато: фармоиш нарасид. Боз кӯшиш кунед.')}
}
function Rv(id,s){DB.set('orders',id,{st:s})}
function ban(o){
 const L=o.it.map(i=>esc(i.n)+' × '+i.q+(i.c?' ('+esc(i.c)+')':'')).join(', ');
 if(o.st=='new')return `⏳ Фармоиши ${sid(o)} интизори тасдиқ аст.`;
 if(o.st=='rej')return '🚫 Бубахшед, фармоиши '+sid(o)+' рад шуд.'+(o.rs?' Сабаб: '+esc(o.rs):'');
 if(o.st=='done')return '🎉 Ташаккур! Фармоиш гирифта шуд.';
 if(o.st=='no')return '😔 Бубахшед, мо бо шумо тамос мегирем.';
 if(Date.now()>=due(o))return `✅ Қабул шуд: ${L}.<br><b>Фармоишро гирифтед?</b><div class="nv"><button class="pb" onclick="Rv('${o.id}','done')">Бале</button><button onclick="Rv('${o.id}','no')">Не</button></div>`;
 return `✅ Фармоиши ${sid(o)} қабул шуд: ${L}.<br>Омода мешавад: ${o.m} дақиқа.`;
}
function C(){
 let h=st==0&&cl=='h'?SL():'';
 if(LO)h+=`<div class="n">${ban(LO)}</div>`;
 if(st==0){
  const n=Object.values(cart).reduce((a,b)=>a+b,0);
  if(!S.d.length)h+='<p>Меню ҳоло холӣ аст.</p>';
  h+=cl=='t'?CT():cl=='m'?MP():cl=='h'?CH():'';
  if(cl=='h')h+='<div class="g">'+(gc?S.d.filter(x=>x.g==gc):S.d).map(d=>`<div class="cd ${d.k>0?'':'off'}" onclick="det='${d.id}';sv=0;R()">${d.o?'<span class="rib">Аксия</span>':''}${pic(d)}<b>${esc(d.n)}</b><div class="pr">${d.o?`<s>${d.o}</s> `:''}${d.v&&d.v.length?'аз '+Math.min(...d.v.map(x=>x.p)):d.p} сомонӣ</div><small>${d.k>0?'⏱ '+d.t+' дақ.':'Нест'}</small></div>`).join('')+'</div>';
  if(det&&dd(det)){const d=dd(det);h+=`<div class="md" onclick="det='';R()"><div class="bx" onclick="event.stopPropagation()">${pic(d,'bg')}<h3>${esc(d.n)}</h3><p>${esc(d.r||'')}</p>${d.v&&d.v.length?`<div class="r" style="flex-wrap:wrap;justify-content:flex-start">${d.v.map((x,j)=>`<button class="${sv==j?'on':''}" onclick="sv=${j};R()">${esc(x.n)} · ${x.p}</button>`).join('')}</div>`:''}<p>⏱ ${d.t} дақиқа · <b>${d.v&&d.v.length?d.v[sv].p:d.p} сомонӣ</b></p>${d.k>0?`<button class="pb" onclick="Q('${d.id}${d.v&&d.v.length?'|'+sv:''}',1);det='';R();T('✓ Ба сабад илова шуд')">Ба сабад илова кунед</button>`:'<p><b>Ҳозир нест</b></p>'}</div></div>`}
  if(n)h+=`<button class="pb fx" onclick="st=1;R()">Фармоиш (${n}) · ${tot(cart)} сомонӣ</button>`;
 }else if(st==1){
  h+='<h3>Фармоиши шумо</h3>'+Object.entries(cart).map(([i,q])=>`<div class="cd"><div class="r"><span>${esc(vn(i))}</span><span><button onclick="Q('${i}',-1)">−</button> ${q} <button onclick="Q('${i}',1)">+</button></span><b>${vp(i)*q}</b></div><input placeholder="Эзоҳ (масалан: капуста кам)" value="${esc(nt[i]||'')}" oninput="nt['${i}']=this.value"></div>`).join('')+`<div class="r"><b>Ҷамъ</b><b>${tot(cart)} сомонӣ</b></div><div class="nv"><button onclick="st=0;R()">← Ба қафо</button><button class="pb" onclick="st=2;R()">Ба пеш →</button></div>`;
 }else{
  if(!f.ph)f.ph=ME().ph||'';if(!f.nm)f.nm=ME().nm||'';
  h+=`<h3>Маълумот</h3><input placeholder="Ном" value="${esc(f.nm||'')}" oninput="f.nm=this.value"><input type="tel" placeholder="Рақами телефон" value="${esc(f.ph||'')}" oninput="f.ph=this.value">
  <div class="r"><label><input type="radio" name="ty" ${f.type=='del'?'checked':''} onchange="f.type='del';R()"> Доставка</label><label><input type="radio" name="ty" ${f.type=='in'?'checked':''} onchange="f.type='in';R()"> Дар ҷой</label></div>`;
  if(f.type=='del')h+=`<input placeholder="Суроға" value="${esc(f.a||'')}" oninput="f.a=this.value"><button onclick="G()">📍 Ҷойгиршавии ман</button>`;
  h+=`<div class="r"><label><input type="radio" name="py" ${f.pay=='cash'?'checked':''} onchange="f.pay='cash';R()"> Нақд</label><label><input type="radio" name="py" ${f.pay=='card'?'checked':''} onchange="f.pay='card';R()"> Корт</label></div>`;
  if(f.pay=='card')h+=`<div class="n">💳 Маблағи ${tot(cart)} сомониро ба корт гузаронед${S.pay?': <b>'+esc(S.pay)+'</b>':''}. Баъд акси чекро фиристед.</div><button onclick="pid='ck';$('#fi').click()">📎 Ирсоли акси чек ${ck?'✓':''}</button>${ck?`<img class="im rc" src="${ck}" alt="">`:''}`;
  h+=`<div class="nv"><button onclick="st=1;R()">← Ба қафо</button><button class="pb" onclick="P()">Фармоиш додан</button></div>`;
 }
 if(st==0)h+=NV();
 return h;
}
function SL(){const b=S.c.ban||[];if(!b.length)return `<div class="hero"><img class="lg" src="${LOGO}" alt="S Cafe"><div><h1>S Cafe</h1><small>Тез ва болаззат</small></div></div>`;
 return '<div id="sl">'+b.map(x=>`<div class="bn" ${x.d?`onclick="det='${x.d}';sv=0;R()"`:''} ${x.i?`style="background-image:linear-gradient(#0000,#0008),url(${x.i})"`:''}><b>${esc(x.t)}</b><span>${esc(x.s||'')}</span>${x.d?'<small>Фармоиш додан →</small>':''}</div>`).join('')+'</div>'}
function NV(){
 const I={h:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 c:'<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/>',
 t:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
 m:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>'};
 const n=Object.values(cart).reduce((a,b)=>a+b,0);
 const t=(k,l)=>`<button class="${cl==k?'on':''}" onclick="${k=='c'?'Ct()':`cl='${k}';gc='';det='';${k=='m'?'LH()':'R()'}`}"><svg viewBox="0 0 24 24">${I[k]}</svg><span>${l}</span>${k=='c'&&n?`<i class="bd">${n}</i>`:''}</button>`;
 return `<div class="nb">${t('h','Асосӣ')}${t('c','Сабад')}${t('t','Тамос')}${t('m','Ман')}</div>`}
function CH(){const c=S.c.cats||[];if(!c.length)return '';
 return '<div id="ch"><button class="'+(!gc?'on':'')+'" onclick="gc=\'\';R()">Ҳама</button>'+c.map(x=>`<button class="${gc==x.id?'on':''}" onclick="gc='${x.id}';R()">${esc(x.e||'')} ${esc(x.n)}</button>`).join('')+'</div>'}
function Ct(){if(!Object.keys(cart).length)return T('Сабад холӣ аст');st=1;R()}
function TL(){const c=S.c.cats||[];if(!c.length)return '<p>Гурӯҳ ҳоло нест.</p>';
 return '<div class="g">'+c.map(x=>`<div class="cd" onclick="gc='${x.id}';R()"><div class="em">${esc(x.e||'🍽️')}</div><b>${esc(x.n)}</b><br><small>${S.d.filter(d=>d.g==x.id).length} намуд</small></div>`).join('')+'</div>'}
function CT(){const c=S.c;const b=(e,n,h)=>h?`<a class="bt" href="${h}"${h.startsWith('http')?' target="_blank" rel="noopener"':''}>${e} ${n}</a>`:'';
 return '<h3>Тамос</h3>'+b('📷','Instagram',safe(c.ig))+b('📞',esc(c.ph||'Телефон'),c.ph?'tel:'+esc(c.ph.replace(/[^0-9+]/g,'')):'')+b('📍',esc(c.ad||'Суроға'),safe(c.ml)||(c.ad?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(c.ad):''))}
function MP(){const m=ME();
 let h=`<h3>Ман</h3><div class="cd"><input id="mn" placeholder="Ном" value="${esc(m.nm||'')}"><input id="mp" type="tel" placeholder="Рақами телефон" value="${esc(m.ph||'')}"><button class="pb" onclick="SM()">Захира кардан</button></div><h3>Фармоишҳои ман</h3>`;
 if(!hist)return h+'<p>Бор мешавад...</p>';
 if(!hist.length)return h+'<p>Фармоиш ҳоло нест.</p>';
 return h+hist.map(o=>`<div class="cd"><b>${sid(o)}</b> · ${new Date(o.ts).toLocaleDateString()} ${new Date(o.ts).toLocaleTimeString().slice(0,5)}<br>${o.it.map(i=>esc(i.n)+' × '+i.q).join(', ')}<br><b>${o.it.reduce((a,i)=>a+i.p*i.q,0)} сомонӣ</b> · ${({new:'⏳ Интизор',ok:'✅ Қабул шуд',done:'🎉 Гирифта шуд',no:'❌ Нагирифт',rej:'🚫 Рад шуд'})[o.st]||''}</div>`).join('')}
function SM(){try{localStorage.setItem('me',JSON.stringify({nm:$('#mn').value,ph:$('#mp').value}))}catch(e){}T('✓ Захира шуд')}
function LH(){hist=null;R();Promise.all(IDS().map(i=>DB.get(i).catch(()=>null))).then(a=>{hist=a.filter(Boolean);if(cl=='m')R()})}
setInterval(()=>{const e=$('#sl');if(e&&e.children.length>1){const w=e.clientWidth,n=e.children.length;e.scrollTo({left:((Math.round(e.scrollLeft/w)+1)%n)*w,behavior:'smooth'})}},4000);
function Up(inp){
 const fl=inp.files[0];if(!fl)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{
  const c=document.createElement('canvas'),s=Math.min(1,(pid=='bn'?800:360)/Math.max(im.width,im.height));
  c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  const u=c.toDataURL('image/jpeg',.7);
  if(pid=='bn'){nbi=u;R()}else if(pid=='ck'){ck=u;R()}else if(pid)DB.set('menu',pid,{i:u});else{nph=u;R()}};im.src=r.result};
 r.readAsDataURL(fl);inp.value='';
}
function Lg(){DB.login($('#le').value,$('#lp').value).catch(()=>alert('Почта ё парол нодуруст аст'))}
function X(oid,iid){const o=S.o.find(x=>x.id==oid);DB.set('orders',oid,{it:o.it.filter(x=>x.id!=iid)})}
function Ac(id){
 const o=S.o.find(x=>x.id==id),m=+$('#m'+id).value;if(!m)return alert('Дақиқаро нависед');
 DB.accept(o,m,S.d.map(d=>d.id)).catch(()=>alert('Хато. Боз кӯшиш кунед.'));
}
function Add(){
 const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!p)return alert('Ном ва нархро нависед');
 const d={n,p,t:+$('#at').value||10,k:+$('#ak').value||0,r:$('#ar').value,g:$('#ag').value,e:'🍽️'};
 if(+$('#ao').value)d.o=+$('#ao').value;if(nph)d.i=nph;nph='';DB.add('menu',d).then(R);
}
const VE=d=>`<div><small>Андоза / намуд (масалан: 0.5л, 1л, 2л):</small>${(d.v||[]).map((x,j)=>`<div class="r"><span>${esc(x.n)} · ${x.p} сомонӣ</span><button onclick="VD('${d.id}',${j})">🗑</button></div>`).join('')}<input id="vn${d.id}" placeholder="Ном (масалан: 1л)"><input id="vp${d.id}" type="number" placeholder="Нарх"><button onclick="VA('${d.id}')">+ Андоза илова кунед</button></div>`;
function VA(id){const n=$('#vn'+id).value.trim(),p=+$('#vp'+id).value;if(!n||!p)return alert('Ном ва нархро нависед');DB.set('menu',id,{v:[...(dd(id).v||[]),{n,p}]})}
function VD(id,j){DB.set('menu',id,{v:(dd(id).v||[]).filter((_,x)=>x!=j)})}
const ED=d=>{const i=(k,p,t)=>`<label><small>${p}</small><input ${t?'type="number"':''} value="${esc(d[k]||'')}" onchange="DB.set('menu','${d.id}',{${k}:${t?'+this.value':'this.value'}})"></label>`;return i('n','Ном')+i('r','Рецепт / таркиб')+i('t','Дақиқа',1)+i('o','Нархи пештара (аксия, 0 = нест)',1)+VE(d)};
const GS=(v,fn,id)=>`<select ${id?'id="'+id+'"':''} onchange="${fn}"><option value="">Гурӯҳ</option>${(S.c.cats||[]).map(x=>`<option value="${x.id}" ${x.id==v?'selected':''}>${esc(x.n)}</option>`).join('')}</select>`;

function BA(){const t=$('#bt').value.trim();if(!t)return;DB.set('cfg','main',{ban:[...(S.c.ban||[]),{id:Date.now().toString(36),t,s:$('#bs').value,d:$('#bd').value,i:nbi}]});nbi=''}
function AC(){const c=S.c.cats||[],b=S.c.ban||[];
 return `<div class="cd"><b>Гурӯҳҳо</b>${c.map(x=>`<div class="r"><span>${esc(x.e||'')} ${esc(x.n)}</span><button onclick="CD('cats','${x.id}')">🗑</button></div>`).join('')}<input id="gn" placeholder="Номи гурӯҳ (масалан: Бургер)"><input id="ge" placeholder="Эмодзи (масалан: 🍔)"><button class="pb" onclick="GA()">Илова кардан</button></div>
 <div class="cd"><b>Баннерҳо (комбо / аксия)</b>${b.map(x=>`<div class="r"><span>${x.i?`<img class="th" src="${x.i}" alt="">`:''}${esc(x.t)}</span><button onclick="CD('ban','${x.id}')">🗑</button></div>`).join('')}<input id="bt" placeholder="Сарлавҳа (масалан: Комбо 40 сомонӣ)"><input id="bs" placeholder="Матни хурд"><select id="bd"><option value="">Таом/комборо пайваст кунед</option>${S.d.map(d=>`<option value="${d.id}">${esc(d.n)}</option>`).join('')}</select><button onclick="pid='bn';$('#fi').click()">📷 Акс ${nbi?'✓':''}</button> <button class="pb" onclick="BA()">Илова кардан</button></div>`}
function AS(){const c=S.c,i=(k,p)=>`<input placeholder="${p}" value="${esc(c[k]||'')}" onchange="DB.set('cfg','main',{${k}:this.value})">`;
 return `<div class="cd"><b>Тамос</b>${i('ig','Instagram линк (https://...)')}${i('ph','Рақами телефон')}${i('ad','Суроға')}${i('ml','Линки харита (Google Maps)')}</div>`}

 let h=`<div class="nv"><button class="${tab=='o'?'on':''}" onclick="tab='o';R()">Фармоишҳо${OL().filter(o=>o.st=='new').length?' 🔴'+OL().filter(o=>o.st=='new').length:''}</button><button class="${tab=='m'?'on':''}" onclick="tab='m';R()">Меню</button><button class="${tab=='c'?'on':''}" onclick="tab='c';R()">Гурӯҳ/Баннер</button><button class="${tab=='s'?'on':''}" onclick="tab='s';R()">Тамос</button><button onclick="DB.logout()">⎋</button></div>`;
 if(tab=='o'){
  if(!OL().length)h+='<p>Фармоиш ҳоло нест.</p>';
  h+=OL().reverse().map(o=>`<div class="cd ${o.st=='done'?'ok':(o.st=='no'||o.st=='rej')?'bad':o.st=='new'?'nw':''}"><b>${sid(o)}</b> · ${new Date(o.ts).toLocaleTimeString().slice(0,5)} · ${esc(o.nm||'')} ${esc(o.ph)} · ${o.ty=='del'?'Доставка: '+esc(o.a):'Дар ҷой'} · ${o.pay=='card'?'Корт':'Нақд'}
  ${o.it.map(i=>`<div class="r"><span>${esc(i.n)} × ${i.q}${i.c?'<br><small>💬 '+esc(i.c)+'</small>':''}</span><span>${i.p*i.q} ${o.st=='new'?`<button onclick="X('${o.id}','${i.id}')">✕</button>`:''}</span></div>`).join('')}
  <div class="r"><b>Ҷамъ: ${o.it.reduce((a,i)=>a+i.p*i.q,0)} сомонӣ</b></div>
  ${o.ck?`<small>🧾 Чеки пардохт:</small><img class="im rc" src="${o.ck}" alt="">`:''}
  ${o.st=='new'?`<input id="m${o.id}" type="number" placeholder="Чанд дақиқа омода мешавад?"><button class="pb" onclick="Ac('${o.id}')">Қабул ва паём ба мизоҷ</button> <button onclick="Rj('${o.id}')">🚫 Рад кардан</button>`
  :o.st=='ok'?`<small>✅ Қабул шуд · ${o.m} дақ. · Ҷавоби мизоҷ интизор аст</small>`
  :o.st=='done'?'<b>✅ Муваффақ</b>':o.st=='rej'?'<b>🚫 Рад шуд</b>'+(o.rs?' · '+esc(o.rs):''):'<b>❌ Мизоҷ нагирифт</b>'}</div>`).join('');
 }else if(tab=='c'){h+=AC()}else if(tab=='s'){h+=AS()}else{
  h+=S.d.map(d=>`<div class="cd"><div class="r"><span>${d.i?`<img class="th" src="${d.i}" alt="">`:''}<b>${esc(d.n)}</b></span><span><button onclick="ed=ed=='${d.id}'?'':'${d.id}';R()">✏️</button> <button onclick="pid='${d.id}';$('#fi').click()">📷</button> <button onclick="if(confirm('Нест кунем?'))DB.del('menu','${d.id}')">🗑</button></span></div>
  <div class="r"><label><small>Нарх</small><input type="number" value="${d.p}" onchange="DB.set('menu','${d.id}',{p:+this.value})"></label><label><small>Мондаи анбор (дона)</small><input type="number" value="${d.k}" onchange="DB.set('menu','${d.id}',{k:+this.value})"></label></div>${GS(d.g,"DB.set('menu','"+d.id+"',{g:this.value})")}${ed==d.id?ED(d):''}</div>`).join('')
  +`<div class="cd"><b>Маълумоти пардохт (рақами корт)</b><input placeholder="Рақами корт ва ном" value="${esc(S.pay||'')}" onchange="DB.set('cfg','main',{pay:this.value})"></div><div class="cd"><b>Таоми нав / комбо / аксия</b><input id="an" placeholder="Ном (масалан: Комбо: бургер + фри)"><input id="ap" type="number" placeholder="Нарх"><input id="ao" type="number" placeholder="Нархи пештара (барои аксия)"><input id="at" type="number" placeholder="Дақиқа"><input id="ak" type="number" placeholder="Чанд дона дорем?"><input id="ar" placeholder="Рецепт / таркиб">${GS('','','ag')}<button onclick="pid='';$('#fi').click()">📷 Акс интихоб кунед ${nph?'✓':''}</button> <button class="pb" onclick="Add()">Илова кардан</button></div>`;
 }
 return h;
}

 DB.menu(a=>{S.d=a;if(v=='c'?st==0:true)R()});
 DB.cfg(c=>{S.c=c;S.pay=c.pay||'';if(v=='c'?st==0:true)R()});
 let id='';try{id=localStorage.getItem('last')}catch(e){}
 if(id)uo=DB.order(id,o=>{LO=o;if(st==0&&v=='c')R()});
 DB.auth(u=>{AU=u;if(u&&!ao){ao=1;DB.purge().catch(()=>{});DB.orders(a=>{const n0=S.o.filter(o=>o.st=='new').length,fs=!ld;ld=1;S.o=a;if(!fs&&a.filter(o=>o.st=='new').length>n0)Bp();R()})}R()});
}
window.addEventListener('dbready',init);
setInterval(()=>{if(v=='c'&&st==0&&!det&&LO&&LO.st=='ok'&&Date.now()>=due(LO))R()},20000);
R();

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

const app=initializeApp({
 apiKey:"AIzaSyAVHyZgnmzcIU6j-XjcAa6fC4tvioscRqk",
 authDomain:"fast-food-fe9ab.firebaseapp.com",
 projectId:"fast-food-fe9ab",
 storageBucket:"fast-food-fe9ab.firebasestorage.app",
 messagingSenderId:"769329495086",
 appId:"1:769329495086:web:8f3b416253d55b972e73bf"});
const db=getFirestore(app,'default'),au=getAuth(app);
const list=s=>s.docs.map(d=>({...d.data(),id:d.id}));
const W=e=>{alert('Хато: '+e.code+'. Қоидаҳои Firestore ва почтаи админро санҷед.');throw e};
window.DB={
 menu:cb=>onSnapshot(collection(db,'menu'),s=>cb(list(s))),
 orders:cb=>onSnapshot(query(collection(db,'orders'),where('ts','>',Date.now()-864e5),orderBy('ts')),s=>cb(list(s)),e=>console.log(e)),
 order:(id,cb)=>onSnapshot(doc(db,'orders',id),s=>cb(s.exists()?{...s.data(),id:s.id}:null)),
 cfg:cb=>onSnapshot(doc(db,'cfg','main'),s=>cb(s.data()||{})),
 set:(c,id,d)=>setDoc(doc(db,c,id),d,{merge:true}).catch(W),
 add:(c,d)=>addDoc(collection(db,c),d).catch(W),
 del:(c,id)=>deleteDoc(doc(db,c,id)).catch(W),
 accept:(o,m,ids)=>{const b=writeBatch(db);
  o.it.forEach(i=>{if(ids.includes(i.id))b.update(doc(db,'menu',i.id),{k:increment(-i.q)})});
  b.update(doc(db,'orders',o.id),{st:'ok',m,at:Date.now()});return b.commit()},
 get:id=>getDoc(doc(db,'orders',id)).then(s=>s.exists()?{...s.data(),id:s.id}:null),
 purge:async()=>{const s=await getDocs(query(collection(db,'orders'),where('ts','<',Date.now()-30*864e5)));const b=writeBatch(db);s.docs.forEach(d=>b.delete(d.ref));if(s.size)await b.commit()},
